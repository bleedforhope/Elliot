<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0c0c0c">
<link rel="manifest" href="./manifest.webmanifest">
<title>irc</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="terminal">
  <section id="session" class="session"></section>

  <form id="chat" class="input-line" autocomplete="off">
    <span class="input-prefix">&lt;friend&gt;</span>
    <input id="message" type="text" autocomplete="off" spellcheck="false" disabled>
    <button id="send" type="submit" disabled>send</button>
  </form>

  <footer>
    <span id="status">offline</span>
    <button id="initialize" type="button">connect</button>
    <button id="clear" type="button">clear</button>
  </footer>
</main>

<script type="module" src="./app.js"></script>
</body>
</html>
